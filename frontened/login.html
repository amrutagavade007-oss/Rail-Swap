<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RailSwap - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            🚆 RailSwap
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- Main Content -->
    <main>

        <section class="hero">

            <h1>Welcome Back to RailSwap</h1>

            <p>Login to manage your journey and seat swap requests.</p>


            <!-- Login Form -->
            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Message -->
            <p id="message"></p>


            <!-- Register Link -->
            <p>
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
