<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- this is titles -->
    <title>RailSwap - Register</title>
    <!-- this is css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            🚆 RailSwap
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>

        <section class="hero">

            <h1>Create Your RailSwap Account</h1>

            <form id="registerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >

                <button type="submit">
                    Register
                </button>

            </form>

            <p id="message"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
